<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Farm2Market application architecture</title>
  <desc id="desc">Customer and Farmer Android applications connect to Supabase Auth, PostgreSQL, and Realtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5fbf5"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#1c8b54"/><stop offset="1" stop-color="#35ae72"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#355fd3"/><stop offset="1" stop-color="#6488f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173c2d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#70869a"/></marker>
    <style>
      .h{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#163528}.sub{font:16px 'Segoe UI',Arial,sans-serif;fill:#617468}
      .card{fill:#fff;stroke:#dce8df;stroke-width:2}.title{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#18392c}
      .body{font:15px 'Segoe UI',Arial,sans-serif;fill:#607469}.tiny{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:.8px;fill:#62806e}
      .white{fill:#fff}.line{stroke:#879baa;stroke-width:3;fill:none;marker-end:url(#arrow)}.live{stroke:#288d58;stroke-width:3;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <text x="64" y="64" class="h">One marketplace, two Android apps</text>
  <text x="64" y="94" class="sub">Kotlin + Jetpack Compose clients share a secure Supabase backend.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="150" width="300" height="282" rx="24" class="card"/>
    <rect x="64" y="150" width="300" height="12" rx="6" fill="url(#blue)"/>
    <rect x="96" y="185" width="58" height="58" rx="17" fill="#edf2ff"/>
    <text x="125" y="224" text-anchor="middle" font-size="30">🛒</text>
    <text x="96" y="278" class="title">Customer app</text>
    <text x="96" y="310" class="body">• Browse nearby produce</text>
    <text x="96" y="340" class="body">• Build a cart and place orders</text>
    <text x="96" y="370" class="body">• Follow live order status</text>
    <text x="96" y="407" class="tiny">:customer · ANDROID</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="916" y="150" width="300" height="282" rx="24" class="card"/>
    <rect x="916" y="150" width="300" height="12" rx="6" fill="url(#green)"/>
    <rect x="948" y="185" width="58" height="58" rx="17" fill="#e9f7ed"/>
    <text x="977" y="224" text-anchor="middle" font-size="30">🌱</text>
    <text x="948" y="278" class="title">Farmer app</text>
    <text x="948" y="310" class="body">• List and update products</text>
    <text x="948" y="340" class="body">• Manage stock and sold-out items</text>
    <text x="948" y="370" class="body">• Receive and fulfill orders</text>
    <text x="948" y="407" class="tiny">:farmer · ANDROID</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="474" y="132" width="332" height="318" rx="26" fill="#fff" stroke="#d9e7dc" stroke-width="2"/>
    <rect x="474" y="132" width="332" height="62" rx="24" fill="#eaf5ed"/>
    <path d="M474 170h332v24H474z" fill="#eaf5ed"/>
    <text x="640" y="173" text-anchor="middle" class="title">Supabase</text>
    <rect x="506" y="218" width="268" height="55" rx="15" fill="#f5f8ff"/>
    <circle cx="534" cy="245" r="12" fill="#567ae0"/><text x="560" y="251" class="title" font-size="17">Auth · email + password</text>
    <rect x="506" y="286" width="268" height="70" rx="15" fill="#f3faf5"/>
    <circle cx="534" cy="321" r="12" fill="#31a367"/><text x="560" y="316" class="title" font-size="17">Postgres + RLS</text>
    <text x="560" y="339" class="body" font-size="13">profiles · products · orders</text>
    <rect x="506" y="369" width="268" height="55" rx="15" fill="#fff8eb"/>
    <circle cx="534" cy="396" r="12" fill="#e1a63e"/><text x="560" y="402" class="title" font-size="17">Realtime updates</text>
  </g>

  <path d="M364 250H458" class="line"/><path d="M916 250H822" class="line"/>
  <path d="M364 365H458" class="live"/><path d="M916 365H822" class="live"/>
  <text x="411" y="232" text-anchor="middle" class="tiny">READ / WRITE</text>
  <text x="869" y="232" text-anchor="middle" class="tiny">READ / WRITE</text>
  <text x="411" y="395" text-anchor="middle" class="tiny">LIVE EVENTS</text>
  <text x="869" y="395" text-anchor="middle" class="tiny">LIVE EVENTS</text>
  <text x="640" y="488" text-anchor="middle" class="sub">A shared Kotlin module contains the common UI, data models, and Supabase client.</text>
</svg>
