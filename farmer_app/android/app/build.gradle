plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def configFile = rootProject.file('supabase.properties')
def config = new Properties()
if (configFile.exists()) configFile.withInputStream { config.load(it) }

def safeField = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'com.farm2market.farmer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.farm2market.farmer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'SUPABASE_URL', safeField(config.getProperty('supabase.url', 'https://ikxnhtbvsetlizrkaxtj.supabase.co'))
        buildConfigField 'String', 'SUPABASE_KEY', safeField(config.getProperty('supabase.publishableKey', ''))
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation project(':shared')
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

